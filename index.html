    <style>
      /* Boot overlay — shows a spinner while the app JavaScript loads,
         covering the pre-rendered SEO content (which stays in the DOM for crawlers). */
      #app-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f7f4;
      }
      #app-boot .app-boot__spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid rgba(234, 82, 33, 0.18);
        border-top-color: #ea5221;
        animation: app-boot-spin 0.7s linear infinite;
      }
      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-boot" role="status" aria-label="Loading">
      <div class="app-boot__spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
